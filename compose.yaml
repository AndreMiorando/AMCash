name: amcash

services:
  postgres:
    image: postgres:17-alpine
    container_name: amcash-postgres
    environment:
      POSTGRES_DB: amcash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - amcash_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amcash"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amcash_postgres_data:

