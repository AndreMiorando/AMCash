spring:
  application:
    name: amcash-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/amcash}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:amcash-development-secret-key-change-me-now}
  expiration: ${JWT_EXPIRATION:86400000}

google:
  auth:
    client-id: ${GOOGLE_CLIENT_ID:}
